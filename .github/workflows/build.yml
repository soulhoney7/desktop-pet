name: 데스크탑펫 exe 만들기

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 프로그램 설치
        run: python -m pip install PySide6-Essentials pillow pillow-heif numpy onnxruntime pyinstaller

      - name: exe 만들기
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DesktopPet --icon icon.ico --collect-binaries onnxruntime --collect-all pillow_heif --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy --exclude-module pandas desktop_pet.py

      - name: 배경 제거 시험
        run: |
          mkdir shots
          python ci/test_bg.py shots/0_배경제거_시험.png

      - name: exe 실행 시험 + 화면 캡처
        shell: pwsh
        run: |
          $d = "$env:APPDATA\DesktopPet\pets"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item ci\pets\*.png $d
          '{"global_scale": 120, "pets": {}, "help_shown": true}' | Set-Content "$env:APPDATA\DesktopPet\settings.json" -Encoding utf8
          $p = Start-Process dist\DesktopPet.exe -ArgumentList "--settings" -PassThru
          Start-Sleep 30
          python ci/shot.py shots/1_실행직후.png
          Start-Sleep 8
          python ci/shot.py shots/2_돌아다니는중.png
          Start-Process notepad
          Start-Sleep 5
          python ci/shot.py shots/3_메모장_열자마자.png
          Start-Sleep 5
          python ci/shot.py shots/4_메모장_위.png
          if (Test-Path "$env:APPDATA\DesktopPet\error.log") { Get-Content "$env:APPDATA\DesktopPet\error.log"; Copy-Item "$env:APPDATA\DesktopPet\error.log" shots\ }
          if ($p.HasExited) { throw "exe가 실행 중에 꺼졌어요" }
          Stop-Process -Id $p.Id

      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPet
          path: |
            dist/DesktopPet.exe
            shots/
