name: 데스크탑펫 exe 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 프로그램 설치
        run: python -m pip install PySide6-Essentials pillow pillow-heif numpy onnxruntime pyinstaller

      - name: exe 만들기
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DesktopPet --icon icon.ico --collect-binaries onnxruntime --collect-all pillow_heif --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy --exclude-module pandas desktop_pet.py

      - name: 배경 제거 시험
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          python ci/test_bg.py shots/0_배경제거_시험.png *>&1 | Tee-Object shots/log_배경제거.txt
          python ci/make_group_pet.py shots/0_여러마리_한펫.png *>&1 | Tee-Object -Append shots/log_배경제거.txt
          if ($LASTEXITCODE -ne 0) { throw "배경 제거 시험 실패" }

      - name: 가벼움 측정 (이전 버전과 비교)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force shots, old | Out-Null
          $d = "$env:APPDATA\DesktopPet\pets"
          New-Item -ItemType Directory -Force $d | Out-Null
          Remove-Item "$d\*" -ErrorAction SilentlyContinue
          Copy-Item ci\pets\*.png $d
          '{"global_scale": 120, "pets": {}, "help_shown": true}' | Set-Content "$env:APPDATA\DesktopPet\settings.json" -Encoding utf8
          gh release download build-9 -p DesktopPet.exe -D old -R ${{ github.repository }}
          if (Test-Path old\DesktopPet.exe) { pwsh -File ci/measure.ps1 -exe old\DesktopPet.exe -label "이전 버전" -out shots/측정.txt }
          pwsh -File ci/measure.ps1 -exe dist\DesktopPet.exe -label "새 버전" -out shots/측정.txt

      - name: 장면 녹화 (부딪힘, 기차, 간식, 퇴근임박, 퇴근)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Get-Process DesktopPet -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item "$env:APPDATA\DesktopPet\running.lock" -ErrorAction SilentlyContinue
          python ci/make_group_pet.py shots/0_여러마리_한펫.png
          $env:DESKTOPPET_DEMO = "1"
          $go = "$env:APPDATA\DesktopPet\demo_go"
          # 예전 버전이 켜져 있는 상태에서 새 버전 켜기 (자동으로 예전 것 끄고 교체되는지)
          if (Test-Path old\DesktopPet.exe) {
            $null = Start-Process old\DesktopPet.exe -PassThru
            Start-Sleep 20
            "예전 버전 켠 뒤 프로세스 수: $((Get-Process DesktopPet).Count)" | Tee-Object -FilePath shots/교체시험.txt -Append
          }
          $env:DESKTOPPET_TAKEOVER = "1"
          $p = Start-Process dist\DesktopPet.exe -PassThru
          Start-Sleep 22
          "새 버전 켠 뒤 프로세스 수: $((Get-Process DesktopPet).Count)  (onefile은 1개당 2개)" | Tee-Object -FilePath shots/교체시험.txt -Append
          Get-Process DesktopPet | ForEach-Object { "  " + $_.Path } | Tee-Object -FilePath shots/교체시험.txt -Append
          python ci/record.py shots/13_여러마리_통통.gif 10
          python ci/record.py shots/7_부딪힘.gif 12 $go bump
          python ci/record.py shots/8_기차놀이.gif 34 $go train
          python ci/record.py shots/9_간식.gif 12 $go snack
          python ci/record.py shots/10_퇴근1시간전.gif 14 $go "clock 16:59:57"
          python ci/record.py shots/11_퇴근축하.gif 12 $go "clock 17:59:57"
          python ci/shot.py shots/12_퇴근축하_사진.png
          Start-Sleep 8
          python ci/shot.py shots/14_숨기기전.png
          python ci/keys.py 0.012 right right right
          Start-Sleep 2
          python ci/shot.py shots/15_아주짧은연타3번_숨김.png
          python ci/keys.py left up left
          Start-Sleep 2
          python ci/shot.py shots/16_다시3번_보임.png
          python ci/keys.py right
          Start-Sleep 1
          python ci/keys.py right
          Start-Sleep 1
          python ci/keys.py right
          Start-Sleep 2
          python ci/shot.py shots/17_천천히3번_그대로.png
          if (Test-Path "$env:APPDATA\DesktopPet\error.log") { Copy-Item "$env:APPDATA\DesktopPet\error.log" shots\error_demo.log }
          if (Test-Path "$env:APPDATA\DesktopPet\keys_debug.txt") { Copy-Item "$env:APPDATA\DesktopPet\keys_debug.txt" shots\ }
          Get-Process DesktopPet -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 3
          Remove-Item "$env:APPDATA\DesktopPet\running.lock" -ErrorAction SilentlyContinue

      - name: exe 실행 시험 + 화면 캡처
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $d = "$env:APPDATA\DesktopPet\pets"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item ci\pets\*.png $d
          '{"global_scale": 120, "pets": {}, "help_shown": true}' | Set-Content "$env:APPDATA\DesktopPet\settings.json" -Encoding utf8
          $env:DESKTOPPET_TRACE = "1"
          $p = Start-Process dist\DesktopPet.exe -ArgumentList "--settings" -PassThru
          Start-Sleep 30
          python ci/shot.py shots/1_실행직후.png
          Start-Sleep 8
          python ci/shot.py shots/2_돌아다니는중.png
          Start-Process notepad
          Start-Sleep 1
          pwsh -File ci/move_window.ps1 -x 330 -y 320
          python ci/record.py shots/5_메모장_열고_20초.gif 20
          python ci/shot.py shots/3_메모장_20초뒤.png
          pwsh -File ci/move_window.ps1 -x 120 -y 260
          python ci/record.py shots/6_메모장_옮기기.gif 8
          python ci/shot.py shots/4_메모장_옮긴뒤.png
          "exe 살아있음: $(-not $p.HasExited)" | Tee-Object shots/log_실행.txt
          if (Test-Path "$env:APPDATA\DesktopPet\trace.txt") { Copy-Item "$env:APPDATA\DesktopPet\trace.txt" shots\ }
          if (Test-Path "$env:APPDATA\DesktopPet\error.log") { Copy-Item "$env:APPDATA\DesktopPet\error.log" shots\ }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id }

      - name: 결과를 Release로 올리기
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Compress-Archive -Path shots\* -DestinationPath shots.zip -Force
          $tag = "build-${{ github.run_number }}"
          $files = @("shots.zip")
          if (Test-Path dist\DesktopPet.exe) { $files += "dist\DesktopPet.exe" }
          gh release create $tag @files --title "데스크탑펫 빌드 ${{ github.run_number }}" --notes "자동 빌드. DesktopPet.exe를 받아서 실행하세요."
